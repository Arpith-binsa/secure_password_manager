{% extends "base.html" %}
{% block title %}Credential{% endblock %}
{% block content %}
<div class="card form-card">
    <h1>{{ data.site }}</h1>

    <label>Login username / email</label>
    <div class="secret-box">{{ data.login_username }}</div>

    <label>Password</label>
    <div class="password-row">
        <input id="stored-password" type="password" value="{{ data.login_password }}" readonly>
        <button type="button" class="button secondary" onclick="togglePassword('stored-password')">Show</button>
        <button type="button" class="button secondary" onclick="copyPassword()">Copy</button>
    </div>

    {% if data.notes %}
    <label>Notes</label>
    <div class="secret-box">{{ data.notes }}</div>
    {% endif %}

    <div class="actions">
        <a class="button secondary" href="{{ url_for('edit_credential', credential_id=credential.id) }}">Edit</a>
        <a class="button" href="{{ url_for('vault') }}">Back to vault</a>
    </div>
</div>
<script>
function togglePassword(id) {
    const field = document.getElementById(id);
    field.type = field.type === "password" ? "text" : "password";
}
async function copyPassword() {
    const field = document.getElementById("stored-password");
    await navigator.clipboard.writeText(field.value);
}
</script>
{% endblock %}
